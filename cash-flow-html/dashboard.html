<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Cash Flow Management</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <!-- User Info -->
            <div class="user-info">
                <h5 id="userName">User</h5>
                <small id="userType">Employee</small>
            </div>

            <!-- Navigation Menu -->
            <nav>
                <ul class="nav-menu">
                    <li>
                        <a href="#" class="nav-link active" data-section="home">
                            <i class="fas fa-home"></i>
                            HOME
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link" data-section="transactions">
                            <i class="fas fa-exchange-alt"></i>
                            TRANSACTIONS
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link" data-section="contacts">
                            <i class="fas fa-address-book"></i>
                            CONTACTS
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link" data-section="inventory">
                            <i class="fas fa-boxes"></i>
                            INVENTORY
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Logout Button -->
            <button class="logout-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt me-2"></i>
                Logout
            </button>
        </div>

        <!-- Content Area -->
        <div class="content-area">
            <div id="contentArea">
                <!-- Section content will be loaded here -->
                <div class="text-center mt-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3">Loading dashboard...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Configuration and API -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

    <!-- Section Scripts -->
    <script src="js/sections/home.js"></script>
    <script src="js/sections/transactions.js"></script>
    <script src="js/sections/contacts.js"></script>
    <script src="js/sections/inventory.js"></script>

    <!-- Dashboard Main Script -->
    <script src="js/dashboard.js"></script>
</body>
</html>
